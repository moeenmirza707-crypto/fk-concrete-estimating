<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#090D16"/>
  <!-- Blueprint Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Accent Glow -->
  <circle cx="950" cy="200" r="300" fill="#EA580C" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="200" cy="500" r="250" fill="#0284C7" fill-opacity="0.08" filter="blur(80px)" />

  <!-- Brand Badge -->
  <rect x="80" y="80" width="60" height="60" rx="12" fill="#EA580C" />
  <text x="96" y="122" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">FK</text>
  
  <text x="160" y="105" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">FK Concrete Estimating</text>
  <text x="160" y="130" font-family="monospace" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="2">CSI DIVISION 03 SPECIALISTS</text>

  <!-- Main Headline -->
  <text x="80" y="250" font-family="system-ui, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF">
    Concrete Estimating Services
  </text>
  <text x="80" y="315" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#F97316">
    &amp; Measured Quantity Takeoffs
  </text>

  <!-- Subtitle -->
  <text x="80" y="380" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">
    Cubic Yards • Formwork SFCA • ASTM Rebar Schedules • Bluebeam Vector Markups
  </text>

  <!-- Technical Spec Box -->
  <rect x="80" y="440" width="1040" height="110" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <text x="120" y="485" font-family="monospace" font-size="14" font-weight="700" fill="#F59E0B">DELIVERABLES</text>
  <text x="120" y="520" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Excel (.xlsx) + Bluebeam PDF</text>

  <line x1="420" y1="460" x2="420" y2="530" stroke="#334155" stroke-width="1" />

  <text x="460" y="485" font-family="monospace" font-size="14" font-weight="700" fill="#F59E0B">TURNAROUND</text>
  <text x="460" y="520" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">24 to 48 Hours Standard</text>

  <line x1="740" y1="460" x2="740" y2="530" stroke="#334155" stroke-width="1" />

  <text x="780" y="485" font-family="monospace" font-size="14" font-weight="700" fill="#F59E0B">TARGET MARKET</text>
  <text x="780" y="520" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Nationwide USA</text>
</svg>

